<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Torin Chacko — Backend Developer and Systems Engineer</title>
  <desc id="desc">Purple terminal-inspired social preview card for Torin Chacko's portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07050c"/>
      <stop offset="0.58" stop-color="#100b1c"/>
      <stop offset="1" stop-color="#1d1434"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#b16cff"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#b16cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#b16cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#b16cff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="80" r="410" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="74" y="68" width="1052" height="494" rx="22" fill="#0b0813" fill-opacity=".74" stroke="#3b2a60"/>
  <circle cx="112" cy="107" r="7" fill="#ff5f8f"/>
  <circle cx="137" cy="107" r="7" fill="#c084fc"/>
  <circle cx="162" cy="107" r="7" fill="#a855f7"/>
  <text x="190" y="114" fill="#6d5f8c" font-family="JetBrains Mono, Consolas, monospace" font-size="18">portfolio.sh</text>
  <text x="112" y="224" fill="#b16cff" font-family="JetBrains Mono, Consolas, monospace" font-size="30">$ whoami</text>
  <text x="112" y="319" fill="#e6dcf7" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">Torin Chacko</text>
  <rect x="112" y="350" width="650" height="5" rx="3" fill="url(#accent)"/>
  <text x="112" y="419" fill="#cba4ff" font-family="JetBrains Mono, Consolas, monospace" font-size="28">Backend Developer · Systems Engineer</text>
  <text x="112" y="468" fill="#a394c2" font-family="Inter, Arial, sans-serif" font-size="23">Low-level architecture · Performance · Mathematical software</text>
  <g transform="translate(892 262)">
    <rect width="158" height="158" rx="20" fill="#171029" stroke="#b16cff" stroke-opacity=".6"/>
    <text x="79" y="95" text-anchor="middle" fill="url(#accent)" font-family="JetBrains Mono, Consolas, monospace" font-size="58" font-weight="700">&gt;_</text>
  </g>
</svg>
